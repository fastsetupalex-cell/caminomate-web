<style>
  :root { --bg:#0d0f13; --bg2:#12151b; --card:#171a21; --line:#262a33; --tx:#f3f4f6; --mut:#a9afba; --acc:#fbb03b; --acc2:#f7b500; --ink:#14213a; }
  * { box-sizing:border-box; margin:0; }
  html { scroll-behavior:smooth; }
  body { font-family:Figtree, system-ui, -apple-system, sans-serif; background:var(--bg); color:var(--tx); line-height:1.5; -webkit-font-smoothing:antialiased; overflow-x:hidden; }
  img { max-width:100%; display:block; }
  a { color:var(--acc); }
  .wrap { max-width:1120px; margin:0 auto; padding:0 20px; }

  /* cabecera */
  .top { position:sticky; top:0; z-index:20; background:rgba(13,15,19,.82); backdrop-filter:saturate(1.4) blur(12px); -webkit-backdrop-filter:saturate(1.4) blur(12px); border-bottom:1px solid transparent; transition:border-color .2s; }
  .top.scrolled { border-bottom-color:var(--line); }
  .top .wrap { display:flex; align-items:center; justify-content:space-between; gap:12px; height:64px; }
  .logo { display:flex; align-items:center; gap:10px; font-weight:800; font-size:19px; color:var(--tx); text-decoration:none; }
  .logo img { width:34px; height:34px; border-radius:9px; }
  .top-r { display:flex; align-items:center; gap:10px; }
  select { background:var(--card); color:var(--tx); border:1px solid var(--line); border-radius:10px; padding:7px 8px; font:inherit; font-size:14px; }
  .mini { display:none; background:var(--acc); color:var(--ink); font-weight:800; font-size:14px; padding:8px 14px; border-radius:10px; text-decoration:none; }
  .top.scrolled .mini { display:inline-block; }

  /* portada */
  .hero { background:radial-gradient(90% 70% at 70% 10%, #2c2410 0%, transparent 60%), radial-gradient(70% 60% at 0% 100%, #11203a 0%, transparent 60%); }
  .hero .wrap { display:grid; grid-template-columns:1.1fr .9fr; gap:48px; align-items:center; padding-top:48px; padding-bottom:64px; }
  .eyebrow { display:inline-flex; align-items:center; gap:8px; background:#1e1a10; border:1px solid #3b3017; color:var(--acc); font-weight:700; font-size:13px; letter-spacing:.4px; padding:6px 12px; border-radius:999px; }
  h1 { font-size:clamp(38px, 5.6vw, 66px); line-height:1.02; letter-spacing:-1.5px; font-weight:800; margin-top:18px; }
  h1 em { font-style:normal; color:var(--acc); display:block; }
  .lead { color:var(--mut); font-size:clamp(17px, 2vw, 20px); margin-top:18px; max-width:540px; }
  .ctas { display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin-top:28px; }
  .store { display:inline-flex; align-items:center; gap:12px; background:#fff; color:#000; text-decoration:none; padding:11px 20px 11px 16px; border-radius:14px; transition:transform .15s; }
  .store:hover { transform:translateY(-2px); }
  .store svg { width:28px; height:28px; flex:none; }
  .store span { display:flex; flex-direction:column; line-height:1.1; }
  .store small { font-size:12px; font-weight:600; }
  .store b { font-size:21px; font-weight:700; letter-spacing:-.3px; }
  .ghost { color:var(--tx); text-decoration:none; font-weight:700; padding:12px 16px; border-radius:12px; border:1px solid var(--line); }
  .ghost:hover { border-color:#3a3f4a; }
  .android { color:var(--mut); font-size:14px; margin-top:14px; }
  .qr { display:flex; align-items:center; gap:14px; margin-top:26px; padding:12px; border:1px solid var(--line); border-radius:16px; background:var(--card); max-width:340px; }
  .qr div:first-child { background:#fff; padding:6px; border-radius:10px; width:86px; height:86px; flex:none; }
  .qr svg { width:100%; height:100%; display:block; }
  .qr p { color:var(--mut); font-size:14px; }
  .qr b { color:var(--tx); display:block; }
  .pros { display:flex; flex-wrap:wrap; gap:8px 18px; margin-top:22px; color:var(--mut); font-size:14px; }
  .pros span::before { content:""; display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--acc); margin-right:7px; vertical-align:1px; }

  .phone { position:relative; justify-self:center; width:min(330px, 78vw); aspect-ratio: 430 / 932; border-radius:46px; padding:10px; background:linear-gradient(160deg, #3a3f4a, #1b1e25); box-shadow:0 40px 100px rgba(0,0,0,.55), 0 0 0 1px #444a56 inset; }
  .phone img { width:100%; height:100%; object-fit:cover; object-position:top; border-radius:37px; }
  .phone::after { content:""; position:absolute; inset:-30% -40%; background:radial-gradient(closest-side, rgba(251,176,59,.18), transparent); z-index:-1; }

  /* bloques */
  section { padding:72px 0; }
  .titulo { text-align:center; max-width:720px; margin:0 auto 44px; }
  .titulo h2 { font-size:clamp(30px, 4vw, 44px); line-height:1.08; letter-spacing:-1px; font-weight:800; }
  .titulo h2 em { font-style:normal; color:var(--acc); }
  .titulo p { color:var(--mut); font-size:18px; margin-top:12px; }

  .feat { display:grid; grid-template-columns:1fr 1fr; gap:56px; align-items:center; max-width:980px; margin:0 auto 72px; }
  .feat:last-child { margin-bottom:0; }
  .feat.rev .ftx { order:2; }
  .feat .num { color:var(--acc); font-weight:800; font-size:14px; letter-spacing:2px; }
  .feat h3 { font-size:clamp(26px, 3.4vw, 38px); line-height:1.08; letter-spacing:-.8px; font-weight:800; margin-top:8px; }
  .feat h3 em { font-style:normal; color:var(--acc); }
  .feat p { color:var(--mut); font-size:18px; margin-top:12px; }
  .feat .phone { width:min(290px, 70vw); }

  .rutas { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; max-width:860px; margin:0 auto; }
  .rutas span { background:var(--card); border:1px solid var(--line); border-radius:999px; padding:8px 16px; font-weight:600; }

  .planes { display:grid; grid-template-columns:1fr 1fr; gap:18px; max-width:880px; margin:0 auto; }
  .plan { background:var(--card); border:1px solid var(--line); border-radius:24px; padding:28px; }
  .plan.dest { border-color:#5a4718; background:linear-gradient(180deg, #1f1b10, var(--card) 60%); }
  .plan h3 { font-size:24px; font-weight:800; }
  .plan .tag { color:var(--acc); font-weight:700; font-size:14px; margin-top:4px; }
  .plan ul { list-style:none; padding:0; margin-top:16px; display:grid; gap:10px; }
  .plan li { padding-left:28px; position:relative; color:#d7dbe2; }
  .plan li::before { content:""; position:absolute; left:0; top:4px; width:16px; height:16px; border-radius:50%; background:#1f3a2a; box-shadow:inset 0 0 0 5px #3ccf7a; }
  .plan .nota { color:var(--mut); font-size:14px; margin-top:16px; }

  .banda { background:linear-gradient(135deg, #1f1b10 0%, #12151b 55%); border:1px solid #3b3017; border-radius:28px; padding:44px 28px; text-align:center; max-width:980px; margin:0 auto; }
  .banda h2 { font-size:clamp(28px, 4vw, 42px); line-height:1.08; letter-spacing:-1px; font-weight:800; }
  .banda p { color:var(--mut); font-size:18px; margin:12px auto 0; max-width:620px; }
  .banda .ctas { justify-content:center; }

  .dos { display:grid; grid-template-columns:1fr 1fr; gap:18px; max-width:980px; margin:0 auto; }
  .caja { background:var(--card); border:1px solid var(--line); border-radius:24px; padding:28px; }
  .caja h3 { font-size:22px; font-weight:800; }
  .caja p { color:var(--mut); margin-top:10px; }

  footer { border-top:1px solid var(--line); padding:28px 0 110px; color:var(--mut); font-size:14px; }
  footer .wrap { display:flex; flex-wrap:wrap; gap:12px 26px; justify-content:space-between; }
  footer nav { display:flex; flex-wrap:wrap; gap:12px 22px; }
  footer a { color:var(--mut); }

  /* barra fija de descarga en móvil */
  .barra { position:fixed; left:12px; right:12px; bottom:calc(12px + env(safe-area-inset-bottom)); z-index:30; display:none; align-items:center; gap:12px; background:rgba(23,26,33,.95); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border:1px solid var(--line); border-radius:18px; padding:10px 10px 10px 12px; box-shadow:0 10px 40px rgba(0,0,0,.5); transform:translateY(140%); transition:transform .25s ease; }
  .barra.on { transform:none; }
  .barra img { width:40px; height:40px; border-radius:10px; flex:none; }
  .barra div { flex:1; min-width:0; line-height:1.2; }
  .barra b { display:block; font-size:15px; }
  .barra small { color:var(--mut); font-size:12.5px; }
  .barra a { background:var(--acc); color:var(--ink); font-weight:800; text-decoration:none; padding:10px 16px; border-radius:12px; white-space:nowrap; }

  .rv { opacity:0; transform:translateY(18px); transition:opacity .6s ease, transform .6s ease; }
  .rv.in { opacity:1; transform:none; }
  @media (prefers-reduced-motion: reduce) { .rv { opacity:1; transform:none; transition:none; } html { scroll-behavior:auto; } }

  @media (max-width: 860px) {
    .hero .wrap { grid-template-columns:1fr; text-align:center; padding-top:28px; gap:36px; }
    .lead { margin-left:auto; margin-right:auto; }
    .ctas, .pros { justify-content:center; }
    .qr { display:none; }
    .feat, .feat.rev { grid-template-columns:1fr; gap:26px; text-align:center; margin-bottom:64px; }
    .feat.rev .ftx { order:0; }
    .feat .phone { order:2; }
    .planes, .dos { grid-template-columns:1fr; }
    section { padding:56px 0; }
    .barra { display:flex; }
    .top .mini { display:none !important; }
  }
  @media (max-width: 400px) { .store b { font-size:19px; } .ghost { display:none; } }
</style>
</head>

};
const esAndroid = /Android/i.test(navigator.userAgent);
const pick = () => { try { const q = new URLSearchParams(location.search).get("lang"); if (q && T[q]) return q; } catch (e) {}
  try { const s = localStorage.getItem("cm_lang"); if (s && T[s]) return s; } catch (e) {}
  for (const l of (navigator.languages || [navigator.language || "es"])) { const k = String(l).slice(0, 2).toLowerCase(); if (T[k]) return k; } return "en"; };
function aplicar(l) {
  const t = T[l]; document.documentElement.lang = l; document.getElementById("lang").value = l;
  document.querySelectorAll("[data-t]").forEach((e) => { const k = e.dataset.t; e.innerHTML = (k === "android" && esAndroid) ? t.androidNow : t[k]; });
  document.querySelectorAll("[data-img]").forEach((e) => { e.src = `img/${l}-${e.dataset.img}.jpg`; e.alt = "CaminoMate"; });
  document.querySelectorAll("[data-list]").forEach((e) => { e.innerHTML = t[e.dataset.list].map((x) => `<li>${x}</li>`).join(""); });
}
document.getElementById("lang").addEventListener("change", (e) => { try { localStorage.setItem("cm_lang", e.target.value); } catch (er) {} aplicar(e.target.value); });
aplicar(pick());
// QR para pasar del ordenador al móvil
try { const q = qrcode(0, "M"); q.addData(APP); q.make(); document.getElementById("qr").innerHTML = q.createSvgTag({ cellSize: 3, margin: 0, scalable: true }); } catch (e) { document.querySelector(".qr").style.display = "none"; }
// Cabecera y barra de descarga al hacer scroll
const cab = document.getElementById("top"), barra = document.getElementById("barra");
const onScroll = () => { const y = window.scrollY; cab.classList.toggle("scrolled", y > 40); barra.classList.toggle("on", y > 520 && (window.innerHeight + y) < document.body.scrollHeight - 140); };
addEventListener("scroll", onScroll, { passive: true }); onScroll();
// Aparición suave de los bloques
const io = "IntersectionObserver" in window ? new IntersectionObserver((es) => es.forEach((x) => { if (x.isIntersecting) { x.target.classList.add("in"); io.unobserve(x.target); } }), { threshold: .12 }) : null;
document.querySelectorAll(".rv").forEach((el) => io ? io.observe(el) : el.classList.add("in"));
</script>
